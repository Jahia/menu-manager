mnumix_component=Menus
mnu_navigation=Menu
mnu_navigation_description=Shows one of the site's menus, built in jContent > Menus.
mnu_navigation.jcr_title=Accessible name
mnu_navigation.jcr_title.ui.tooltip=Names the menu for screen readers, for example "Main menu" or "Footer links". Visitors never see it on screen.
mnu_navigation.menu=Menu
mnu_navigation.menu.ui.tooltip=The menu to show. Menus are built and translated in jContent > Menus.
mnu_navigation.layout=Layout
mnu_navigation.layout.ui.tooltip=How the menu is drawn: a horizontal bar with dropdowns, a mega menu (a full-width panel per top item, its items in columns), a vertical list, or columns (a footer).
mnu_navigation.layout.horizontal=Horizontal bar
mnu_navigation.layout.mega=Mega menu
mnu_navigation.layout.vertical=Vertical list
mnu_navigation.layout.columns=Columns
mnu_navigation.maxDepth=Levels shown
mnu_navigation.maxDepth.ui.tooltip=How many levels of the menu to show, from 1 (top level only) to 3.
mnu_menus=Menus
mnu_menu=Menu
mnu_menu.fallbackLanguage=Fallback language
mnu_menu.fallbackLanguage.ui.tooltip=The language whose labels show when an item has none in the visitor's language. The site's default language when empty.
mnumix_menuItem.label=Label
mnumix_menuItem.label.ui.tooltip=The text of the item. A page item without a label shows its page's title.
mnumix_menuItem.description=Description
mnumix_menuItem.description.ui.tooltip=A short sentence under the label, shown by layouts that have room for it.
mnumix_menuItem.itemStyle=Style
mnumix_menuItem.itemStyle.ui.tooltip=How the item stands out: as the others, highlighted, or as a button.
mnumix_menuItem.itemStyle.default=Normal
mnumix_menuItem.itemStyle.highlight=Highlighted
mnumix_menuItem.itemStyle.button=Button
mnumix_menuItem.promoImage=Promotion image
mnumix_menuItem.promoImage.ui.tooltip=An image from the media library, shown in the mega menu's promotion.
mnumix_menuItem.promoImageAlt=Promotion image text alternative
mnumix_menuItem.promoImageAlt.ui.tooltip=What the image shows, for screen readers. The image's title is used when empty.
mnumix_menuItem.promoTitle=Promotion title
mnumix_menuItem.promoTitle.ui.tooltip=Title of the promotion shown in the mega menu beside this item's columns. Leave it empty for no promotion (a page item then shows its page's own promotion, if any).
mnumix_menuItem.promoText=Promotion text
mnumix_menuItem.promoText.ui.tooltip=A sentence or two under the promotion title.
mnumix_menuItem.promoLinkLabel=Promotion button label
mnumix_menuItem.promoLinkLabel.ui.tooltip=Text of the promotion's button, for example "See the offer".
mnumix_menuItem.promoTarget=Promotion link
mnumix_menuItem.promoTarget.ui.tooltip=The page or content the promotion's button opens.
mnumix_menuItem.promoUrl=Promotion address
mnumix_menuItem.promoUrl.ui.tooltip=An address outside the platform for the promotion's button, starting with https://, http://, mailto: or tel:.
mnu_pageItem=Page
mnu_pageItem.page=Page
mnu_pageItem.page.ui.tooltip=The page the item links to.
mnu_pageItem.includeSubpages=Include subpages
mnu_pageItem.includeSubpages.ui.tooltip=Shows the page's own subpages under it, so new pages appear without editing the menu.
mnu_sectionItem=Section
mnu_internalLinkItem=Internal link
mnu_internalLinkItem.target=Target
mnu_internalLinkItem.target.ui.tooltip=The content the item links to: a page of another site, a news item, a file.
mnu_internalLinkItem.newTab=Open in a new tab
mnu_internalLinkItem.newTab.ui.tooltip=Opens the link in a new tab; screen readers are told.
mnu_externalLinkItem=External link
mnu_externalLinkItem.url=Address
mnu_externalLinkItem.url.ui.tooltip=An address starting with https://, http://, mailto: or tel:.
mnu_externalLinkItem.newTab=Open in a new tab
mnu_externalLinkItem.newTab.ui.tooltip=Opens the link in a new tab; screen readers are told.
