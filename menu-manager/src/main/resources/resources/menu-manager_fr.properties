mnumix_component=Menus
mnu_navigation=Menu
mnu_navigation_description=Affiche l'un des menus du site, construits dans jContent > Menus.
mnu_navigation.jcr_title=Nom accessible
mnu_navigation.jcr_title.ui.tooltip=Nomme le menu pour les lecteurs d'écran, par exemple « Menu principal » ou « Liens de pied de page ». Les visiteurs ne le voient jamais à l'écran.
mnu_navigation.menu=Menu
mnu_navigation.menu.ui.tooltip=Le menu à afficher. Les menus se construisent et se traduisent dans jContent > Menus.
mnu_navigation.layout=Disposition
mnu_navigation.layout.ui.tooltip=Comment le menu est dessiné : une barre horizontale avec listes déroulantes, un méga-menu (un panneau pleine largeur par élément de premier niveau, ses éléments en colonnes), une liste verticale, ou des colonnes (un pied de page).
mnu_navigation.layout.horizontal=Barre horizontale
mnu_navigation.layout.mega=Méga-menu
mnu_navigation.layout.vertical=Liste verticale
mnu_navigation.layout.columns=Colonnes
mnu_navigation.maxDepth=Niveaux affichés
mnu_navigation.maxDepth.ui.tooltip=Combien de niveaux du menu afficher, de 1 (premier niveau seulement) à 3.
mnu_menus=Menus
mnu_menu=Menu
mnu_menu.fallbackLanguage=Langue de repli
mnu_menu.fallbackLanguage.ui.tooltip=La langue dont les libellés s'affichent quand un élément n'en a pas dans la langue du visiteur. La langue par défaut du site si vide.
mnumix_menuItem.label=Libellé
mnumix_menuItem.label.ui.tooltip=Le texte de l'élément. Un élément page sans libellé affiche le titre de sa page.
mnumix_menuItem.description=Description
mnumix_menuItem.description.ui.tooltip=Une courte phrase sous le libellé, affichée par les dispositions qui ont la place.
mnumix_menuItem.itemStyle=Style
mnumix_menuItem.itemStyle.ui.tooltip=Comment l'élément ressort : comme les autres, mis en avant, ou comme un bouton.
mnumix_menuItem.itemStyle.default=Normal
mnumix_menuItem.itemStyle.highlight=Mis en avant
mnumix_menuItem.itemStyle.button=Bouton
mnumix_menuItem.promoImage=Image de la promotion
mnumix_menuItem.promoImage.ui.tooltip=Une image de la médiathèque, affichée dans la promotion du méga-menu.
mnumix_menuItem.promoImageAlt=Texte alternatif de l'image de la promotion
mnumix_menuItem.promoImageAlt.ui.tooltip=Ce que montre l'image, pour les lecteurs d'écran. Le titre de l'image est utilisé si vide.
mnumix_menuItem.promoTitle=Titre de la promotion
mnumix_menuItem.promoTitle.ui.tooltip=Titre de la promotion affichée dans le méga-menu à côté des colonnes de cet élément. Laissez vide pour aucune promotion (un élément page affiche alors la promotion de sa page, s'il en a une).
mnumix_menuItem.promoText=Texte de la promotion
mnumix_menuItem.promoText.ui.tooltip=Une ou deux phrases sous le titre de la promotion.
mnumix_menuItem.promoLinkLabel=Libellé du bouton de la promotion
mnumix_menuItem.promoLinkLabel.ui.tooltip=Texte du bouton de la promotion, par exemple « Voir l'offre ».
mnumix_menuItem.promoTarget=Lien de la promotion
mnumix_menuItem.promoTarget.ui.tooltip=La page ou le contenu qu'ouvre le bouton de la promotion.
mnumix_menuItem.promoUrl=Adresse de la promotion
mnumix_menuItem.promoUrl.ui.tooltip=Une adresse hors de la plateforme pour le bouton de la promotion, commençant par https://, http://, mailto: ou tel:.
mnu_pageItem=Page
mnu_pageItem.page=Page
mnu_pageItem.page.ui.tooltip=La page vers laquelle pointe l'élément.
mnu_pageItem.includeSubpages=Inclure les sous-pages
mnu_pageItem.includeSubpages.ui.tooltip=Affiche les sous-pages de la page sous elle, pour que les nouvelles pages apparaissent sans modifier le menu.
mnu_sectionItem=Section
mnu_internalLinkItem=Lien interne
mnu_internalLinkItem.target=Cible
mnu_internalLinkItem.target.ui.tooltip=Le contenu vers lequel pointe l'élément : une page d'un autre site, une actualité, un fichier.
mnu_internalLinkItem.newTab=Ouvrir dans un nouvel onglet
mnu_internalLinkItem.newTab.ui.tooltip=Ouvre le lien dans un nouvel onglet ; les lecteurs d'écran en sont avertis.
mnu_externalLinkItem=Lien externe
mnu_externalLinkItem.url=Adresse
mnu_externalLinkItem.url.ui.tooltip=Une adresse commençant par https://, http://, mailto: ou tel:.
mnu_externalLinkItem.newTab=Ouvrir dans un nouvel onglet
mnu_externalLinkItem.newTab.ui.tooltip=Ouvre le lien dans un nouvel onglet ; les lecteurs d'écran en sont avertis.
