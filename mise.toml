# Toolchain of this repository, the same locally and in CI (jdx/mise-action).
# Maven 3.8: under 3.9 the jahia-maven-plugin dependency scan writes a wrong Import-Package while the
# build still ends BUILD SUCCESS. Node and Yarn build the UI extension (menu-manager) and the views
# (menu-manager-views); Maven installs its own copies for the UI extension (frontend-maven-plugin).
[tools]
java = "temurin-17"
maven = "3.8.8"
node = "22"
yarn = "1.22.22"
